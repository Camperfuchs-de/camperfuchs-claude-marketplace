# Haelt camperfuchs-kontext.plugin automatisch am Quellbaum.
# Laeuft bei jedem Push auf main, der das Plugin oder den Changelog anfasst.
# Prueft alle SKILL.md, scannt auf Secrets, baut das Paket und committet es zurueck,
# wenn es abweicht. Der eigene Commit traegt [skip ci], loest also keinen zweiten Lauf aus.
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - plugins/*
      - CHANGELOG.md
      - ci/plugin_pack.py

pr: none

pool:
  name: macos

steps:
  - checkout: self
    persistCredentials: true
    clean: true

  - script: python3 ci/plugin_pack.py --write
    displayName: 'Skills pruefen und Paket bauen'

  - script: |
      set -e
      git config user.email "build@camperfuchs.de"
      git config user.name "Azure Pipeline"
      # 21.08.2026: Bis zu drei Anlaeufe. Zwischen Build-Start und Push kann eine parallele
      # Session auf main committen - bei mehreren Claude-Sessions passiert das regelmaessig.
      # Der Push wird dann abgelehnt und der Build war rot, obwohl das Paket voellig in
      # Ordnung war (genau so am 21.08. zweimal passiert). Das Paket ist eine erzeugte Datei,
      # also nicht mergen, sondern vom frischen Stand neu bauen und erneut pushen.
      for versuch in 1 2 3; do
        if git diff --quiet -- camperfuchs-kontext.plugin; then
          echo "Paket ist aktuell, nichts zu committen."
          exit 0
        fi
        git add camperfuchs-kontext.plugin
        git commit -m "chore: Plugin-Paket automatisch neu gebaut [skip ci]"
        if git push origin HEAD:main; then
          echo "Paket neu gebaut und gepusht (Anlauf $versuch)."
          exit 0
        fi
        echo "Push abgelehnt, main ist weitergelaufen - neu aufsetzen (Anlauf $versuch)."
        git fetch origin main
        git reset --hard FETCH_HEAD
        python3 ci/plugin_pack.py --write
      done
      echo "Auch nach drei Anlaeufen kein Push moeglich - main aendert sich zu schnell." >&2
      exit 1
    displayName: 'Paket zurueckcommitten, falls veraltet'
